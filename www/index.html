<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDF1EF">
<title>یادبرگ</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --ink:#14262E;--ink2:#52646B;--paper:#EDF1EF;--card:#fff;--line:#D9E1DE;
  --acc:#1B7F79;--acc-ink:#fff;--amber:#F4B942;--red:#C2412D;
  --n0:#fff;--n1:#FBEBC4;--n2:#D3EDE3;--n3:#D6E6F5;--n4:#F5D9D6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E7EFEC;--ink2:#9DB0AA;--paper:#0F1B1F;--card:#17262B;--line:#27393F;
    --acc:#4DB8AE;--acc-ink:#06201D;--red:#E0735F;
    --n0:#17262B;--n1:#4A3F1E;--n2:#1F3F37;--n3:#213A52;--n4:#4B2B28;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Vazirmatn",system-ui,sans-serif;font-size:16px;line-height:1.6}
body{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{padding:18px 20px 8px}
.top h1{margin:0;font-size:26px;font-weight:800;line-height:1.3}
.top p{margin:2px 0 0;color:var(--ink2);font-size:14px}

main{flex:1;overflow-y:auto;padding:8px 16px 150px;-webkit-overflow-scrolling:touch}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 4px 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}

.group{margin:18px 4px 6px;font-size:14px;font-weight:700;color:var(--ink2)}
.group.late{color:var(--red)}

.task{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.chk{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0;stroke:var(--acc-ink)}
.task.done .chk{background:var(--acc);border-color:var(--acc)}
.task.done .chk svg{opacity:1}
.task .body{flex:1;min-width:0;text-align:start;padding:0}
.task .t{display:block;font-weight:600;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--ink2);font-weight:400}
.task .d{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.task .d.late{color:var(--red);font-weight:600}
.task .d svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.search{width:100%;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:2px 0 14px}
.notes{columns:2;column-gap:10px}
.note{break-inside:avoid;display:block;width:100%;text-align:start;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);background:var(--nc,var(--n0))}
.note b{display:block;margin-bottom:2px;overflow-wrap:anywhere}
.note span{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.note .pin{float:left;width:14px;height:14px;fill:var(--amber);stroke:none}

.empty{text-align:center;color:var(--ink2);padding:56px 24px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.clear{display:block;margin:16px auto 0;color:var(--ink2);font-size:14px;text-decoration:underline;padding:8px}

nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--acc);font-weight:700}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,38,46,.28)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

.scrim{position:fixed;inset:0;background:rgba(10,20,24,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .24s ease;max-height:88%;overflow-y:auto}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sheet h2{margin:0 0 12px;font-size:19px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);margin-bottom:12px}
textarea.field{min-height:150px;resize:vertical}
.lbl{display:block;font-size:14px;color:var(--ink2);margin:2px 2px 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--paper)}
.sw{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.colors{display:flex;gap:12px;margin:0 2px 14px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.dot[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.row{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.ghost{flex:none;padding:13px 20px;background:none;border:1px solid var(--line);color:var(--red)}

#toast{position:fixed;inset-inline:24px;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><h1 id="hTitle"></h1><p id="hSub"></p></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="افزودن"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabs" role="tablist">
  <button role="tab" data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>امروز</button>
  <button role="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1.2 1.2L7 5M4 12l1.2 1.2L7 11M4 18l1.2 1.2L7 17"/></svg>کارها</button>
  <button role="tab" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>یادداشت‌ها</button>
</nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var cap=window.Capacitor||{};
var P=cap.Plugins||{};
var native=!!(cap.isNativePlatform&&cap.isNativePlatform());
var LN=P.LocalNotifications, APP=P.App;

/* ---------- data ---------- */
var KEY="yadbarg.v1";
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tasks||!S.notes)S={tasks:[],notes:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(S));syncReminders()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nid(){return Math.floor(Math.random()*2000000000)+1}

/* ---------- helpers ---------- */
var fa=function(n){return Number(n).toLocaleString("fa-IR")};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function pad(n){return n<10?"0"+n:""+n}
function toInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function dueLabel(due){
  var d=new Date(due),t=new Date();
  var diff=Math.round((dayStart(d)-dayStart(t))/864e5);
  var time=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit",hour12:false});
  var day=diff===0?"امروز":diff===1?"فردا":diff===-1?"دیروز":new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long"}).format(d);
  return day+" ساعت "+time;
}
function isLate(t){return !t.done&&t.due&&new Date(t.due).getTime()<Date.now()}
function toast(msg){var el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2200)}
var ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>',
  bell:'<svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15zM10 21h4"/></svg>',
  pin:'<svg class="pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4v7l-1 1-1-1v-7H7v-2l3-3z"/></svg>'
};

/* ---------- reminders ---------- */
async function syncReminders(){
  if(!native||!LN)return;
  try{
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return{id:n.id}})});
    var now=Date.now();
    var list=S.tasks.filter(function(t){return t.remind&&t.due&&!t.done&&new Date(t.due).getTime()>now}).map(function(t){
      return{id:t.nid,title:"یادآوری کار",body:t.title,schedule:{at:new Date(t.due),allowWhileIdle:true}};
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}
async function askPermission(){
  if(native&&LN){try{await LN.requestPermissions()}catch(e){}}
  else if(window.Notification&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
}
/* when the app is open in a browser, check due reminders every 20s */
setInterval(function(){
  if(native)return;
  var now=Date.now(),changed=false;
  S.tasks.forEach(function(t){
    if(t.remind&&t.due&&!t.done&&!t.fired&&new Date(t.due).getTime()<=now){
      t.fired=true;changed=true;toast("یادآوری: "+t.title);
      if(window.Notification&&Notification.permission==="granted"){try{new Notification("یادآوری کار",{body:t.title})}catch(e){}}
    }
  });
  if(changed){localStorage.setItem(KEY,JSON.stringify(S));render()}
},20000);

/* ---------- views ---------- */
var tab="today",query="";
function taskHTML(t){
  var late=isLate(t);
  return '<div class="task'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
    '<button class="chk" data-act="toggle" aria-label="انجام شد">'+ICON.check+'</button>'+
    '<button class="body" data-act="edit"><span class="t">'+esc(t.title)+'</span>'+
    (t.due?'<span class="d'+(late?' late':'')+'">'+(t.remind?ICON.bell:ICON.clock)+dueLabel(t.due)+'</span>':'')+
    '</button></div>';
}
function byDue(a,b){
  if(a.due&&b.due)return new Date(a.due)-new Date(b.due);
  if(a.due)return -1;if(b.due)return 1;return b.created-a.created;
}
function viewToday(){
  var end=dayStart(new Date())+864e5;
  var open=S.tasks.filter(function(t){return !t.done&&t.due&&new Date(t.due).getTime()<end}).sort(byDue);
  var todayAll=S.tasks.filter(function(t){return t.due&&dayStart(new Date(t.due))===dayStart(new Date())});
  var done=todayAll.filter(function(t){return t.done}).length;
  var late=open.filter(isLate),rest=open.filter(function(t){return !isLate(t)});
  var h="";
  if(todayAll.length){
    h+='<div class="bar" aria-hidden="true"><i style="width:'+Math.round(done/todayAll.length*100)+'%"></i></div>';
  }
  if(late.length){h+='<div class="group late">عقب‌افتاده</div>'+late.map(taskHTML).join("")}
  if(rest.length){h+='<div class="group">برای امروز</div>'+rest.map(taskHTML).join("")}
  if(!open.length){
    h+='<div class="empty"><strong>'+(todayAll.length?"کارهای امروز تموم شد":"برای امروز کاری نداری")+'</strong>'+(todayAll.length?"یه استراحت حسابی حقته.":"با دکمه + یه کار با زمان مشخص اضافه کن.")+'</div>';
  }
  return h;
}
function viewTasks(){
  var open=S.tasks.filter(function(t){return !t.done}).sort(byDue);
  var done=S.tasks.filter(function(t){return t.done}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)});
  var h="";
  if(open.length)h+=open.map(taskHTML).join("");
  if(done.length){
    h+='<div class="group">انجام‌شده</div>'+done.map(taskHTML).join("")+'<button class="clear" data-act="clearDone">پاک‌کردن انجام‌شده‌ها</button>';
  }
  if(!S.tasks.length)h='<div class="empty"><strong>هنوز کاری ننوشتی</strong>با دکمه + اولین کار رو اضافه کن.</div>';
  return h;
}
function notesList(){
  var q=query.trim().toLowerCase();
  var list=S.notes.filter(function(n){return !q||(n.title+" "+n.body).toLowerCase().indexOf(q)>-1})
    .sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.updated-a.updated});
  if(!list.length)return '<div class="empty"><strong>'+(q?"چیزی پیدا نشد":"هنوز یادداشتی نداری")+'</strong>'+(q?"عبارت دیگه‌ای امتحان کن.":"با دکمه + اولین یادداشت رو بنویس.")+'</div>';
  return '<div class="notes">'+list.map(function(n){
    return '<button class="note" data-id="'+n.id+'" data-act="edit" style="--nc:var(--n'+(n.color||0)+')">'+
      (n.pinned?ICON.pin:'')+(n.title?'<b>'+esc(n.title)+'</b>':'')+'<span>'+esc(n.body)+'</span></button>';
  }).join("")+'</div>';
}
function viewNotes(){
  return '<input class="search" id="q" type="search" placeholder="جستجو در یادداشت‌ها" value="'+esc(query)+'"><div id="nl">'+notesList()+'</div>';
}
function header(){
  var now=new Date();
  $("#hTitle").textContent=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(now);
  var openN=S.tasks.filter(function(t){return !t.done}).length;
  var remN=S.tasks.filter(function(t){return !t.done&&t.remind&&t.due&&new Date(t.due)>now}).length;
  $("#hSub").textContent=openN?(fa(openN)+" کار باز"+(remN?" و "+fa(remN)+" یادآور فعال داری":" داری")):"همه‌چیز مرتبه";
}
function render(){
  header();
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
  $("#view").innerHTML=tab==="today"?viewToday():tab==="tasks"?viewTasks():viewNotes();
}

/* ---------- sheet ---------- */
var cur=null;
function openSheet(type,id){
  cur={type:type,id:id||null,color:0,pinned:false};
  var h="";
  if(type==="task"){
    var t=id?S.tasks.find(function(x){return x.id===id}):null;
    h='<h2>'+(t?"ویرایش کار":"کار تازه")+'</h2>'+
      '<input class="field" id="fTitle" placeholder="چه کاری باید انجام بدی؟" maxlength="200" value="'+(t?esc(t.title):"")+'">'+
      '<label class="lbl" for="fDue">زمان انجام</label>'+
      '<input class="field" id="fDue" type="datetime-local" value="'+(t&&t.due?t.due:"")+'">'+
      '<div class="chips"><button class="chip" data-q="h1">یک ساعت دیگر</button><button class="chip" data-q="eve">امشب ۲۰:۰۰</button><button class="chip" data-q="tom">فردا ۰۹:۰۰</button></div>'+
      '<label class="sw"><input type="checkbox" id="fRem"'+(t&&t.remind?" checked":"")+'>در همین زمان یادآوری کن</label>';
  }else{
    var n=id?S.notes.find(function(x){return x.id===id}):null;
    if(n){cur.color=n.color||0;cur.pinned=!!n.pinned}
    h='<h2>'+(n?"ویرایش یادداشت":"یادداشت تازه")+'</h2>'+
      '<input class="field" id="fTitle" placeholder="عنوان (اختیاری)" maxlength="120" value="'+(n?esc(n.title):"")+'">'+
      '<textarea class="field" id="fBody" placeholder="بنویس...">'+(n?esc(n.body):"")+'</textarea>'+
      '<div class="colors">'+[0,1,2,3,4].map(function(c){return '<button class="dot" data-color="'+c+'" style="--c:var(--n'+c+')" aria-label="رنگ '+fa(c+1)+'" aria-pressed="'+(cur.color===c)+'"></button>'}).join("")+'</div>'+
      '<label class="sw"><input type="checkbox" id="fPin"'+(cur.pinned?" checked":"")+'>سنجاق‌کردن بالای فهرست</label>';
  }
  h+='<div class="row">'+(id?'<button class="btn ghost" data-sheet="del">حذف</button>':'')+'<button class="btn" data-sheet="save">ذخیره</button></div>';
  $("#sheet").innerHTML=h;
  document.body.classList.add("open");
  if(!id)setTimeout(function(){var f=$("#fTitle");f&&f.focus()},260);
}
function closeSheet(){document.body.classList.remove("open");cur=null}
function quickDue(k){
  var d=new Date();
  if(k==="h1")d=new Date(Date.now()+36e5);
  if(k==="eve"){d.setHours(20,0,0,0);if(d<new Date())d=new Date(Date.now()+36e5)}
  if(k==="tom"){d.setDate(d.getDate()+1);d.setHours(9,0,0,0)}
  d.setSeconds(0,0);
  $("#fDue").value=toInput(d);
}
async function saveSheet(){
  if(!cur)return;
  var title=$("#fTitle").value.trim();
  if(cur.type==="task"){
    if(!title){toast("عنوان کار را بنویس");return}
    var due=$("#fDue").value,rem=$("#fRem").checked;
    if(rem&&!due){toast("برای یادآوری، زمان را مشخص کن");return}
    var t=cur.id?S.tasks.find(function(x){return x.id===cur.id}):null;
    if(!t){t={id:uid(),nid:nid(),created:Date.now(),done:false};S.tasks.push(t)}
    t.title=title;t.due=due;t.remind=rem;t.fired=false;
    if(rem)await askPermission();
  }else{
    var body=$("#fBody").value.trim();
    if(!title&&!body){toast("چیزی بنویس");return}
    var n=cur.id?S.notes.find(function(x){return x.id===cur.id}):null;
    if(!n){n={id:uid()};S.notes.push(n)}
    n.title=title;n.body=body;n.color=cur.color;n.pinned=$("#fPin").checked;n.updated=Date.now();
  }
  save();closeSheet();render();toast("ذخیره شد");
}
function delSheet(){
  if(!cur||!cur.id)return;
  if(cur.type==="task")S.tasks=S.tasks.filter(function(x){return x.id!==cur.id});
  else S.notes=S.notes.filter(function(x){return x.id!==cur.id});
  save();closeSheet();render();toast("حذف شد");
}

/* ---------- events ---------- */
$("#tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  tab=b.dataset.tab;render();$("#view").scrollTop=0;
});
$("#fab").addEventListener("click",function(){openSheet(tab==="notes"?"note":"task")});
$("#scrim").addEventListener("click",closeSheet);
$("#view").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var row=b.closest("[data-id]"),id=row&&row.dataset.id,act=b.dataset.act;
  if(act==="toggle"){
    var t=S.tasks.find(function(x){return x.id===id});
    t.done=!t.done;t.doneAt=t.done?Date.now():0;save();render();
  }else if(act==="edit"){
    openSheet(tab==="notes"?"note":"task",id);
  }else if(act==="clearDone"){
    S.tasks=S.tasks.filter(function(x){return !x.done});save();render();toast("پاک شد");
  }
});
$("#view").addEventListener("input",function(e){
  if(e.target.id==="q"){query=e.target.value;$("#nl").innerHTML=notesList()}
});
$("#sheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.sheet==="save")saveSheet();
  else if(b.dataset.sheet==="del")delSheet();
  else if(b.dataset.q)quickDue(b.dataset.q);
  else if(b.dataset.color){
    cur.color=Number(b.dataset.color);
    document.querySelectorAll(".dot").forEach(function(d){d.setAttribute("aria-pressed",d===b)});
  }
});
if(APP&&APP.addListener){
  APP.addListener("backButton",function(){
    if(cur)closeSheet();
    else if(tab!=="today"){tab="today";render()}
    else APP.minimizeApp&&APP.minimizeApp();
  });
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});

render();syncReminders();
window.__yadbarg={S:S,render:render,openSheet:openSheet};
})();
</script>
</body>
</html>
